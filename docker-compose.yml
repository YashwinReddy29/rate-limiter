version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rate-limiter:
    build: .
    ports:
      - "50051:50051"
      - "8080:8080"
    environment:
      REDIS_ADDR: redis:6379
      GRPC_PORT: 50051
      HTTP_PORT: 8080
    depends_on:
      redis:
        condition: service_healthy