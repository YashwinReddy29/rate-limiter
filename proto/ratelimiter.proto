syntax = "proto3";

package ratelimiter;
option go_package = "github.com/YashwinReddy29/rate-limiter/proto";

service RateLimiter {
  rpc Check(CheckRequest)   returns (CheckResponse);
  rpc Reset(ResetRequest)   returns (ResetResponse);
  rpc GetQuota(QuotaRequest) returns (QuotaResponse);
}

message CheckRequest {
  string client_id  = 1;
  string resource   = 2;
  int32  cost       = 3;
}

message CheckResponse {
  bool   allowed        = 1;
  int64  remaining      = 2;
  int64  limit          = 3;
  int64  reset_after_ms = 4;
  string reason         = 5;
}

message ResetRequest {
  string client_id = 1;
  string resource  = 2;
}

message ResetResponse {
  bool success = 1;
}

message QuotaRequest {
  string client_id = 1;
  string resource  = 2;
}

message QuotaResponse {
  string client_id  = 1;
  string resource   = 2;
  int64  limit      = 3;
  int64  used       = 4;
  int64  remaining  = 5;
  int64  window_sec = 6;
}